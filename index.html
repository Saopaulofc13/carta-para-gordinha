<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Carta</title>
  <style>
    body {
      background-color: #f08ca4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .envelope {
      position: relative;
      width: 250px;
      height: 150px;
      background: #FFFFFF;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 125px solid transparent;
      border-right: 125px solid transparent;
      border-top: 75px solid #F7A7C1;
    }

    .heart {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: red;
      z-index: 2;
      transform-origin: center;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -6px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: -6px;
    }

    .mensagem {
      position: absolute;
      top: -15px; 
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 10px;
      padding: 20px;
      width: 220px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      z-index: 1;
      font-size: 15px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .mensagem.aberta {
        opacity: 1;
    }

    .coracao-msg {
      position: absolute;
      top: 10px;
      font-size: 14px;
      display: none;
    }

    .coracao-msg.esquerdo {
      left: 10px;
    }

    .coracao-msg.direito {
      right: 10px;
    }

    .mensagem.aberta .coracao-msg {
      display: block;
    }

    button {
      background-color: #d42d60;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      z-index: 3;
    }

    button:hover {
      background-color: #bf2754;
    }

    .coracao {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      opacity: 0;
      top: -40px;
      animation: cairCoracao 4s infinite;
    }
    @keyframes cairCoracao {
        0% {
            top: -40px;
            opacity: 1;
            transform: translateX(0);
        }
        100% {
            top: 120%;
            opacity: 1;
            transform: (0);
        }
    }

    .coracao::before,
    .coracao::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .coracao::before {
      top: -10px;
      left: 0;
    }

    .coracao::after {
      top: 0;
      left: -10px;
    }

    @keyframes subir {
      0% { bottom: 0; opacity: 1; transform: translateX(0); }
      100% { bottom: 300px; opacity: 0; transform: translateX(-30px); }
    }
  </style>
</head>
<body>
  <h2>Você recebeu uma carta!</h2>

  <div class="envelope" id="envelope">
    <div class="mensagem" id="mensagem">
      <!-- Corações nos cantos da mensagem -->
      <div class="coracao-msg esquerdo">❤</div>
      <div class="coracao-msg direito">❤</div>

      <p>Maria Elisa, minha gordinha perfeita!<br>
        Eu te amo demais.<br>
        Sempre estarei ao seu lado!<br>
        Eu estarei te apoiando em tudo, vc feliz, me deixa feliz!<br>
        <strong>Eu vou Te Amar Pra Sempre!!</strong></p>
    </div>
    <div class="flap" id="flap"></div>
    <div class="heart" id="heart"></div>
  </div>

  <button onclick="abrirCarta()">Abrir Carta</button>

  <!-- Corações animados no fundo -->
  <div class="coracao" style="left: 30%; animation-delay: 0s;"></div>
  <div class="coracao" style="left: 50%; animation-delay: 1s;"></div>
  <div class="coracao" style="left: 70%; animation-delay: 2s;"></div>

  <script>
    function abrirCarta() {
      document.getElementById('flap').style.display = 'none';
      document.getElementById('heart').style.display = 'none';
      document.getElementById('mensagem').classList.add('aberta');
    }
  </script>
</body>
</html>
